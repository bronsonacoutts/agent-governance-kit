# Agent governance gates (GitHub Actions). Copy this kit's scripts/ folder into the consuming repo
# as scripts/agent-governance/ first. Guide: docs/governed-agentic-delivery.md in the kit.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   WORK_ITEM_PREFIX  e.g. ABC for keys like ABC-123 (default PROJ)
#   HIGH_RISK_PATHS   optional ERE for paths that always need a second reader
#
# Make the "Agent governance" job a required status check on main.
#
# Tamper resistance: the gate scripts run from a checkout of the PR's BASE commit, never from the
# PR itself, so a PR can't weaken a gate that is judging it. The PR checkout is data only (the diff
# and the rule files). A PR that changes the scripts is judged by the old scripts, and the review
# gate treats scripts/agent-governance/ and .github/ as high-risk, so it needs a second reader. Back
# this up with CODEOWNERS on .github/ and scripts/agent-governance/, plus "Require review from Code
# Owners" on main.
#
# Values from the PR (title, body, branch) are passed through env, never interpolated into a script:
# a PR title is attacker-controlled input.
name: Agent Governance

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agent-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governance:
    name: Agent governance
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      WORK_ITEM_PREFIX: ${{ vars.WORK_ITEM_PREFIX || 'PROJ' }}
    steps:
      - name: Check out the pull request (data only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the base commit (trusted gate code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted
          persist-credentials: false

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Select gate scripts
        run: |
          if [ -d .trusted/scripts/agent-governance ]; then
            echo "GOV=$PWD/.trusted/scripts/agent-governance" >> "$GITHUB_ENV"
          else
            # Only while the kit is being introduced: the base has no scripts yet to trust.
            echo "::warning::The base branch has no scripts/agent-governance/, so this run uses the PR's own copy. Merge the scripts before relying on this check."
            echo "GOV=$PWD/scripts/agent-governance" >> "$GITHUB_ENV"
          fi
          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"

      # Each gate runs even if an earlier one failed, so one run reports every problem.
      - name: Work-item reference
        if: ${{ !cancelled() }}
        run: bash "$GOV/work-item-guard.sh"

      - name: Closure declaration
        if: ${{ !cancelled() }}
        run: |
          printf '%s' "$PR_BODY" | node "$GOV/closure-keys.mjs" --mode=guard --branch="$HEAD_REF" --title="$PR_TITLE"

      - name: CI tier
        id: tier
        if: ${{ !cancelled() }}
        run: |
          requested=full
          if echo "$LABELS" | grep -q '"ci-docs"'; then requested=docs; fi
          if echo "$LABELS" | grep -q '"ci-light"'; then requested=light; fi
          node "$GOV/ci-tier.mjs" --requested="$requested" < "$RUNNER_TEMP/changed-files.txt" | tee -a "$GITHUB_OUTPUT"
      # Downstream jobs can skip expensive suites with: needs: governance, if: needs.governance.outputs.tier == 'full'

      - name: Second reader
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          HIGH_RISK_PATHS: ${{ vars.HIGH_RISK_PATHS }}
        run: |
          if [ -z "$HIGH_RISK_PATHS" ]; then unset HIGH_RISK_PATHS; fi
          CHANGED_FILES="$(cat "$RUNNER_TEMP/changed-files.txt")"
          BODY="$PR_BODY"
          # Latest review per human reviewer, excluding the author, counted only if given on HEAD_SHA.
          APPROVALS="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            | node "$GOV/count-approvals.mjs" --format=github --author="$AUTHOR_LOGIN" --commit="$HEAD_SHA")"
          export CHANGED_FILES BODY APPROVALS
          bash "$GOV/review-gate.sh"

      - name: Rule references
        if: ${{ !cancelled() }}
        run: node "$GOV/verify-rule-refs.mjs"
